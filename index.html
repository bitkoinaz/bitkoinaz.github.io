<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="BitkoinAz — exclusive sign-up offers for crypto exchanges.">
  <title>Exclusive Offers · BitkoinAz</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1117'/%3E%3Cpath fill='%230ecb81' d='M16 5.2l1.2 2.4 2.6.4-1.9 1.8.5 2.6L16 11.2 13.6 12.4l.5-2.6-1.9-1.8 2.6-.4L16 5.2zM8 16.5h16v2H8zm1 3.2h14v7.2a1.6 1.6 0 0 1-1.6 1.6H10.6A1.6 1.6 0 0 1 9 26.9V19.7zm6.2 0h1.6v8.8h-1.6z'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --card-2: #1c2128;
      --line: #21262d;
      --line-strong: #30363d;
      --text: #f0f6fc;
      --muted: #9aa4b2;
      --faint: #6e7681;
      --green: #0ecb81;
      --green-2: #3ee0a0;
      --ink: #062117;
    }

    * { box-sizing: border-box; }

    html {
      color-scheme: dark;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 42% at 50% -8%, rgba(14, 203, 129, 0.16), transparent 58%),
        radial-gradient(ellipse 50% 30% at 110% 110%, rgba(45, 125, 246, 0.08), transparent 55%);
    }

    main {
      position: relative;
      width: min(440px, 100%);
      margin: 0 auto;
      padding: 22px 16px calc(28px + env(safe-area-inset-bottom));
    }

    header { text-align: center; margin-bottom: 18px; }

    .gift {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: var(--green-2);
      background: rgba(14, 203, 129, 0.12);
      border: 1px solid rgba(14, 203, 129, 0.28);
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: -0.03em;
      font-weight: 750;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--faint);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .featured {
      background:
        radial-gradient(120% 90% at 0% 0%, rgba(14, 203, 129, 0.18), transparent 52%),
        linear-gradient(180deg, #14221c 0%, #12181f 100%);
      border: 1px solid rgba(14, 203, 129, 0.38);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
    }

    .featured-top {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      align-items: center;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.04em;
      line-height: 1;
      user-select: none;
      flex: none;
    }

    .logo svg { width: 100%; height: 100%; display: block; }

    .logo-word { font-size: 12px; letter-spacing: -0.06em; }

    .logo-line { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16); }

    .featured .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      font-size: 24px;
    }

    .featured .logo-word { font-size: 15px; }

    .name-line {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .featured h2 { font-size: 20px; }

    .tag {
      flex: none;
      max-width: 100%;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #c9d1d9;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bonus {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .featured .bonus {
      margin-top: 4px;
      font-size: 14px;
      color: #b7c0cc;
    }

    .hi { color: var(--green-2); font-weight: 700; }

    .claim {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(14, 203, 129, 0.12);
      color: var(--green-2);
      border: 1px solid rgba(14, 203, 129, 0.4);
      font: inherit;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: -0.01em;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .claim-lg {
      width: 100%;
      min-height: 50px;
      margin-top: 14px;
      background: var(--green);
      color: var(--ink);
      border: none;
      font-size: 16px;
      box-shadow: 0 8px 24px rgba(14, 203, 129, 0.22);
    }

    .claim:focus-visible {
      outline: 2px solid var(--green-2);
      outline-offset: 2px;
    }

    .claim:active { transform: scale(0.98); }

    .logo.has-icon {
      background: transparent;
      overflow: hidden;
    }

    .logo.has-icon img {
      width: 86%;
      height: 86%;
      object-fit: contain;
      display: block;
    }

    .follow { margin-top: 18px; }

    .follow-title {
      margin: 0 0 10px;
      text-align: center;
      color: var(--faint);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .socials {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .social {
      min-width: 0;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      -webkit-tap-highlight-color: transparent;
    }

    .social-icon {
      position: relative;
      width: 22px;
      height: 22px;
      flex: none;
      display: grid;
      place-items: center;
    }

    .social-icon img,
    .social-letter {
      width: 22px;
      height: 22px;
      object-fit: contain;
      display: block;
    }

    .social-letter {
      border-radius: 6px;
      background: #21262d;
      color: var(--text);
      font-size: 11px;
      font-weight: 800;
      line-height: 22px;
      text-align: center;
    }

    .social-icon.is-x {
      background: #000;
      border-radius: 6px;
    }

    .social-icon.is-x img { width: 13px; height: 13px; }

    .social-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .group-badge {
      position: absolute;
      right: -5px;
      bottom: -3px;
      width: 13px;
      height: 13px;
      border-radius: 999px;
      background: var(--green);
      color: var(--ink);
      display: grid;
      place-items: center;
      box-shadow: 0 0 0 2px var(--card);
    }

    .group-badge svg { width: 11px; height: 11px; display: block; }

    .social:focus-visible {
      outline: 2px solid var(--green-2);
      outline-offset: 2px;
    }

    .social:active { transform: scale(0.98); }

    footer {
      margin: 16px 8px 0;
      text-align: center;
      color: var(--faint);
      font-size: 12px;
      line-height: 1.45;
    }

    .error {
      margin: 24px 0;
      text-align: center;
      color: var(--muted);
    }

    @media (hover: hover) {
      .row:hover {
        background: var(--card-2);
        border-color: var(--line-strong);
      }

      .claim:hover, .social:hover { filter: brightness(1.08); }
    }

    @media (min-width: 800px) {
      body { padding: 48px 20px; }

      main {
        background: rgba(13, 17, 23, 0.92);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 28px 20px 22px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.03),
          0 24px 80px rgba(0, 0, 0, 0.45);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .claim:active, .social:active { transform: none; }
    }
  </style>
</head>

  <script>
    (function () {
      var BINANCE_MARK = '<svg viewBox="0 0 40 40" aria-hidden="true"><path fill="#1E2329" d="M20 5 L25 10 L20 15 L15 10 Z M10 15 L15 20 L10 25 L5 20 Z M20 15 L25 20 L20 25 L15 20 Z M30 15 L35 20 L30 25 L25 20 Z M20 25 L25 30 L20 35 L15 30 Z"/></svg>';

      var BRANDS = {
        bybit: { bg: "#F7A600", fg: "#1a1203", text: "B" },
        binance: { bg: "#F0B90B", mark: BINANCE_MARK },
        mexc: { bg: "#2D7DF6", fg: "#ffffff", text: "M" },
        bitget: { bg: "#00F0FF", fg: "#062023", text: "B" },
        okx: { bg: "#000000", fg: "#ffffff", text: "OKX", word: true, line: true }
      };

      var PALETTE = [
        ["#8B5CF6", "#ffffff"],
        ["#F43F5E", "#ffffff"],
        ["#F59E0B", "#1a1203"],
        ["#14B8A6", "#04221e"],
        ["#60A5FA", "#041225"]
      ];

      function esc(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
        });
      }

      function safeUrl(url) {
        var raw = String(url || "").trim();
        try {
          var parsed = new URL(raw);
          if (parsed.protocol !== "https:" && parsed.protocol !== "http:") return "";
          return raw;
        } catch (err) {
          return "";
        }
      }

      function bonusHtml(bonus, highlight) {
        var text = String(bonus || "");
        var needle = String(highlight || "");
        if (!needle) return esc(text);
        var at = text.indexOf(needle);
        if (at < 0) return esc(text);
        return esc(text.slice(0, at)) + '<span class="hi">' + esc(needle) + "</span>" + esc(text.slice(at + needle.length));
      }

      function normId(id) {
        return String(id || "").trim().toLowerCase();
      }

      function safeIcon(path) {
        var raw = String(path || "").trim();
        if (!/^icons\/[a-z0-9][a-z0-9._-]*\.(svg|png|webp)$/i.test(raw)) return "";
        return raw;
      }

      function fallbackStyle(id, name) {
        var brand = BRANDS[normId(id)];
        if (brand && brand.text) {
          return { text: brand.text, bg: brand.bg, fg: brand.fg, word: !!brand.word, line: !!brand.line };
        }
        if (brand && brand.bg) return { text: "B", bg: brand.bg, fg: "#1E2329" };
        var label = String(name || "?").trim();
        var letter = label ? Array.from(label)[0].toUpperCase() : "?";
        var hash = 0;
        for (var i = 0; i < label.length; i++) hash = (hash * 31 + label.charCodeAt(i)) >>> 0;
        var pair = PALETTE[hash % PALETTE.length];
        return { text: letter, bg: pair[0], fg: pair[1] };
      }

      function letterHtml(style) {
        var cls = "logo logo-letter" + (style.word ? " logo-word" : "") + (style.line ? " logo-line" : "");
        return '<div class="' + cls + '" style="background:' + style.bg + ";color:" + style.fg + '">' + esc(style.text) + "</div>";
      }

      function logoHtml(id, name, icon) {
        var src = safeIcon(icon);
        var style = fallbackStyle(id, name);
        if (!src) {
          var brand = BRANDS[normId(id)];
          if (brand && brand.mark) {
            return '<div class="logo" style="background:' + brand.bg + '">' + brand.mark + "</div>";
          }
          return letterHtml(style);
        }
        return '<div class="logo has-icon"><img src="' + esc(src) + '" alt="" data-letter="' + esc(style.text) + '" data-bg="' + style.bg + '" data-fg="' + style.fg + '"' +
          (style.word ? ' data-word="1"' : "") + (style.line ? ' data-line="1"' : "") +
          ' onerror="logoFallback(this)"></div>';
      }

      function logoFallback(img) {
        var parent = img && img.parentNode;
        if (!parent) return;
        parent.className = "logo logo-letter" +
          (img.getAttribute("data-word") === "1" ? " logo-word" : "") +
          (img.getAttribute("data-line") === "1" ? " logo-line" : "");
        parent.style.background = img.getAttribute("data-bg") || "#30363d";
        parent.style.color = img.getAttribute("data-fg") || "#ffffff";
        parent.textContent = img.getAttribute("data-letter") || "?";
      }
      window.logoFallback = logoFallback;

      function socialFallback(img) {
        var span = document.createElement("span");
        span.className = "social-letter";
        span.textContent = img.getAttribute("data-letter") || "?";
        if (img.parentNode) img.replaceWith(span);
      }
      window.socialFallback = socialFallback;

      function tagHtml(badge) {
        var text = String(badge || "").trim();
        if (!text) return "";
        return '<span class="tag">' + esc(text) + "</span>";
      }

      var GROUP_BADGE = '<span class="group-badge" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="5.5" cy="5.1" r="2"/><circle cx="10.5" cy="5.7" r="1.45"/><path d="M1.7 12.5c.55-2.15 2.15-3.25 3.8-3.25s3.25 1.1 3.8 3.25" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/><path d="M9.5 9.6c1.15.15 2.15.95 2.6 2.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span>';

      function socialsHtml(list) {
        if (!Array.isArray(list)) return "";
        var buttons = "";
        list.forEach(function (item) {
          if (!item) return;
          var href = safeUrl(item.url);
          var name = String(item.name || "").trim();
          if (!href || !name) return;
          var id = normId(item.id);
          var src = safeIcon(item.icon);
          var letter = Array.from(name)[0].toUpperCase();
          var icon = src
            ? '<img src="' + esc(src) + '" alt="" data-letter="' + esc(letter) + '" onerror="socialFallback(this)">'
            : '<span class="social-letter">' + esc(letter) + "</span>";
          var trackId = id || "link";
          buttons += '<a class="social" href="' + esc(href) + '" target="_blank" rel="noopener" data-goatcounter-click="social-' + esc(trackId) + '" data-goatcounter-title="' + esc(name) + '">' +
            '<span class="social-icon' + (id === "x" ? " is-x" : "") + '">' + icon + (id === "community" ? GROUP_BADGE : "") + "</span>" +
            '<span class="social-label">' + esc(name) + "</span></a>";
        });
        if (!buttons) return "";
        return '<section class="follow" aria-label="Follow us"><p class="follow-title">Follow us</p><div class="socials">' + buttons + "</div></section>";
      }

      function claimHtml(url, name, large, id) {
        var href = safeUrl(url);
        var label = "Claim " + String(name || "").trim();
        var cls = large ? "claim claim-lg" : "claim";
        if (!href) {
          return '<span class="' + cls + '" aria-disabled="true">Claim ›</span>';
        }
        var slug = normId(id) || "link";
        var path = "click-" + slug + (large ? "-featured" : "");
        return '<a class="' + cls + '" href="' + esc(href) + '" target="_blank" rel="noopener" aria-label="' + esc(label) + '" data-goatcounter-click="' + esc(path) + '" data-goatcounter-title="' + esc(name) + '">Claim ›</a>';
      }

      function usable(data) {
        return !!(data && typeof data === "object" && Array.isArray(data.exchanges) && data.exchanges.some(function (item) {
          return item && String(item.name || "").trim() && safeUrl(item.url);
        }));
      }

      function fallbackData() {
        try {
          return JSON.parse(document.getElementById("offers-fallback").textContent);
        } catch (err) {
          return null;
        }
      }

      function render(data) {
        var app = document.getElementById("app");
        app.setAttribute("aria-busy", "false");
        if (!usable(data)) {
          app.innerHTML = '<p class="error">Couldn\'t load the offers.</p>';
          return;
        }

        var title = String(data.title || "Exclusive Offers");
        var subtitle = String(data.subtitle || "");
        document.title = subtitle ? title + " · " + subtitle : title;

        var featuredId = normId(data.featured);
        var featured = null;
        var rest = [];
        data.exchanges.forEach(function (item) {
          if (!item || !String(item.name || "").trim() || !safeUrl(item.url)) return;
          if (!featured && normId(item.id) === featuredId && featuredId) featured = item;
          else rest.push(item);
        });

        var gift = '<div class="gift" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4.5 10.5h15v8.2a1.8 1.8 0 0 1-1.8 1.8H6.3a1.8 1.8 0 0 1-1.8-1.8v-8.2z" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 7.2h17V10.5h-17z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 7.2v13.3" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.2c-.2-1.6-1.3-3.4-3.1-3.4-1.5 0-2.5 1.1-2.5 2.2 0 1.5 1.7 1.2 5.6 1.2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 7.2c.2-1.6 1.3-3.4 3.1-3.4 1.5 0 2.5 1.1 2.5 2.2 0 1.5-1.7 1.2-5.6 1.2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></div>';

        var html = "<header>" + gift + "<h1>" + esc(title) + "</h1>";
        if (subtitle.trim()) html += '<p class="subtitle">' + esc(subtitle) + "</p>";
        html += "</header>";

        if (featured) {
          html += '<article class="featured"><div class="featured-top">' +
            logoHtml(featured.id, featured.name, featured.icon) +
            '<div><div class="name-line"><h2>' + esc(featured.name) + "</h2>" + tagHtml(featured.badge) + "</div>" +
            '<p class="bonus">' + bonusHtml(featured.bonus, featured.highlight) + "</p></div></div>" +
            claimHtml(featured.url, featured.name, true, featured.id) +
            "</article>";
        }

        if (rest.length) {
          html += '<div class="list">';
          rest.forEach(function (item) {
            html += '<article class="row">' +
              logoHtml(item.id, item.name, item.icon) +
              '<div class="meta"><div class="name-line"><h2>' + esc(item.name) + "</h2>" + tagHtml(item.badge) + "</div>" +
              '<p class="bonus">' + bonusHtml(item.bonus, item.highlight) + "</p></div>" +
              claimHtml(item.url, item.name, false, item.id) +
              "</article>";
          });
          html += "</div>";
        }

        html += socialsHtml(data.socials);

        var footer = String(data.footer || "").trim();
        if (footer) html += "<footer>" + esc(footer) + "</footer>";
        app.innerHTML = html;
        if (window.goatcounter && typeof window.goatcounter.bind_events === "function") {
          window.goatcounter.bind_events();
        }
      }

      fetch("links.json", { cache: "no-cache" })
        .then(function (res) {
          if (!res.ok) throw new Error(String(res.status));
          return res.json();
        })
        .then(function (data) {
          if (!usable(data)) throw new Error("shape");
          render(data);
        })
        .catch(function () {
          render(fallbackData());
        });
    })();
  </script>
  <script data-goatcounter="https://bitkoinaz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
